services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sketchmind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  cloud-tasks-emulator:
    image: ghcr.io/aertje/cloud-tasks-emulator:latest
    command:
      - "-host=0.0.0.0"
      - "-port=8123"
      - "-queue=projects/${GOOGLE_CLOUD_PROJECT}/locations/local/queues/local-subtopic"
    ports:
      - "8123:8123"

  renderer:
    build: ./services/renderer
    ports:
      - "8082:8080"
    environment:
      GCS_BUCKET: ${GCS_BUCKET}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}
      GOOGLE_APPLICATION_CREDENTIALS: /gcp/creds.json
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS:-~/.config/gcloud/application_default_credentials.json}:/gcp/creds.json:ro

  mcp-server:
    build: ./services/mcp-server
    ports:
      - "9090:8080"

  agents:
    build: ./services/agents
    ports:
      - "8081:8080"
    environment:
      RENDER_SERVICE_URL: http://renderer:8080
      MCP_SERVER_URL: http://mcp-server:8080
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}
      GOOGLE_CLOUD_LOCATION: ${AGENTS_VERTEX_LOCATION:-global}
      GOOGLE_GENAI_USE_VERTEXAI: "True"
      GOOGLE_APPLICATION_CREDENTIALS: /gcp/creds.json
      AGENT_PRO_MODEL: ${AGENT_PRO_MODEL:-gemini-3.1-pro-preview}
      AGENT_FLASH_MODEL: ${AGENT_FLASH_MODEL:-gemini-3-flash-preview}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: sketchmind
      DB_USER: postgres
      DB_PASS: localpass
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS:-~/.config/gcloud/application_default_credentials.json}:/gcp/creds.json:ro
    depends_on:
      db:
        condition: service_healthy
      renderer:
        condition: service_started
      mcp-server:
        condition: service_started

  api:
    build: ./services/api
    ports:
      - "8080:8080"
    environment:
      AGENTS_SERVICE_URL: http://agents:8080
      GCP_PROJECT_ID: ${GOOGLE_CLOUD_PROJECT}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: sketchmind
      DB_USER: postgres
      DB_PASS: localpass
      JWT_SECRET: ${JWT_SECRET:-sketchmind-dev-secret}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_APPLICATION_CREDENTIALS: /gcp/creds.json
      SUBTOPIC_QUEUE: local-subtopic
      CLOUD_TASKS_LOCATION: local
      CLOUD_TASKS_EMULATOR_HOST: cloud-tasks-emulator:8123
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS:-~/.config/gcloud/application_default_credentials.json}:/gcp/creds.json:ro
    depends_on:
      db:
        condition: service_healthy
      agents:
        condition: service_started
      cloud-tasks-emulator:
        condition: service_started

  web:
    build:
      context: ./services/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    depends_on:
      - api

volumes:
  pgdata:
